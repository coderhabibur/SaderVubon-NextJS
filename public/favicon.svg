<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="svGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062b1e"/>
      <stop offset="100%" stop-color="#03160f"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#fcb700"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#svGradient)" stroke="#fcb700" stroke-width="2"/>

  <!-- Golden Wheat Symbol -->
  <g fill="url(#goldGradient)">
    <!-- Central stalk -->
    <path d="M32 12 C32 28 32 44 32 52" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Grains -->
    <ellipse cx="26" cy="20" rx="4.5" ry="2.5" transform="rotate(-35 26 20)"/>
    <ellipse cx="38" cy="20" rx="4.5" ry="2.5" transform="rotate(35 38 20)"/>

    <ellipse cx="24" cy="28" rx="5" ry="2.8" transform="rotate(-35 24 28)"/>
    <ellipse cx="40" cy="28" rx="5" ry="2.8" transform="rotate(35 40 28)"/>

    <ellipse cx="23" cy="36" rx="5.2" ry="3" transform="rotate(-35 23 36)"/>
    <ellipse cx="41" cy="36" rx="5.2" ry="3" transform="rotate(35 41 36)"/>

    <ellipse cx="25" cy="44" rx="4.8" ry="2.8" transform="rotate(-35 25 44)"/>
    <ellipse cx="39" cy="44" rx="4.8" ry="2.8" transform="rotate(35 39 44)"/>

    <!-- Top grain -->
    <ellipse cx="32" cy="13" rx="2.5" ry="4.5"/>
  </g>
</svg>
